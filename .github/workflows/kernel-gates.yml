name: kernel-gates

on:
  push:
  pull_request:

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and QEMU
        run: sudo apt-get update && sudo apt-get install -y clang clang-tidy lld llvm qemu-system-arm device-tree-compiler
      - name: Static and ABI gates
        run: make format-check abi-check boundary-check ubsan-check host-tests doc-check
      - name: ARM64 debug boot
        shell: bash
        run: |
          set -o pipefail
          timeout 180 make BUILD_VARIANT=debug run 2>&1 | tee debug.log || test $? -eq 124
          grep -F "[ACCEPTANCE] suite=root-only boot=root-only result=PASS failures=0" debug.log

  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and QEMU
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm qemu-system-arm
      - name: ARM64 production gate
        run: make production-gate
      # production-gate above is static only (ABI/boundary checks) -- it
      # never boots the release profile. That gap is what let the
      # supervision thread fail to spawn in release (no restart-on-fault)
      # while every static check and the (SELFTEST-only) debug boot stayed
      # green: CONFIG_SELFTEST replaces init's main() with the
      # certification suite, so debug boot structurally cannot exercise
      # root_graph.hh's supervise(), the graph that ships. This is the
      # actual production boot gate.
      - name: ARM64 service graph + guest hosting + restart-on-fault
        run: make smoke
      - name: AMD64 compile-only release gate
        run: |
          make BUILD_VARIANT=release ARCH=amd64 PLATFORM=qemu-amd64-q35 O=out/release/amd64 all
          tools/release/check_production_elf.sh out/release/amd64/zilch.elf
          sh tools/release/check_section_permissions.sh out/release/amd64/zilch.elf
          sh tools/release/check_stack_usage.sh out/release/amd64
      - name: Reproducibility
        run: make reproducible-check
